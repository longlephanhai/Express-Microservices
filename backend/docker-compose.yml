services:
  brand-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.brand
    container_name: brand-service
    restart: unless-stopped
    environment:
      BRAND_PORT: 3001
      PORT: 3001
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_BRAND_NAME:-${DB_NAME:-demo}}
      DB_TYPE: mysql
    ports:
      - "3001:3001"
    networks:
      - microservices-net

  category-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.category
    container_name: category-service
    restart: unless-stopped
    environment:
      CATEGORY_PORT: 3002
      PORT: 3002
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_CATEGORY_NAME:-${DB_NAME:-demo}}
      DB_TYPE: mysql
    ports:
      - "3002:3002"
    networks:
      - microservices-net

  product-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.product
    container_name: product-service
    restart: unless-stopped
    environment:
      PRODUCT_PORT: 3003
      PORT: 3003
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_PRODUCT_NAME:-${DB_NAME:-demo}}
      DB_TYPE: mysql
      BRAND_SERVICE_URL: http://brand-service:3001
      CATEGORY_SERVICE_URL: http://category-service:3002
    ports:
      - "3003:3003"
    depends_on:
      brand-service:
        condition: service_started
      category-service:
        condition: service_started
    networks:
      - microservices-net

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.user
    container_name: user-service
    restart: unless-stopped
    environment:
      USER_PORT: 3004
      PORT: 3004
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_USER_NAME:-${DB_NAME:-demo}}
      DB_TYPE: mysql
      JWT_SECRET: ${JWT_SECRET:-just_jwt_secret_key}
      EXPIRATION_TIME: ${EXPIRATION_TIME:-1h}
    ports:
      - "3004:3004"
    networks:
      - microservices-net

  cart-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.cart
    container_name: cart-service
    restart: unless-stopped
    environment:
      CART_PORT: 3005
      PORT: 3005
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_CART_NAME:-${DB_NAME:-demo}}
      DB_TYPE: mysql
    ports:
      - "3005:3005"
    networks:
      - microservices-net

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.order
    container_name: order-service
    restart: unless-stopped
    environment:
      ORDER_PORT: 3006
      PORT: 3006
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_ORDER_NAME:-${DB_NAME:-demo}}
      DB_TYPE: mysql
    ports:
      - "3006:3006"
    networks:
      - microservices-net

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 3000
      PORT: 3000
      BRAND_SERVICE_URL: http://brand-service:3001
      CATEGORY_SERVICE_URL: http://category-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      USER_SERVICE_URL: http://user-service:3004
      CART_SERVICE_URL: http://cart-service:3005
      ORDER_SERVICE_URL: http://order-service:3006
    ports:
      - "3000:3000"
    depends_on:
      - brand-service
      - category-service
      - product-service
      - user-service
      - cart-service
      - order-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
